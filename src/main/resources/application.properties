# Nome da aplicacao
spring.application.name=ArmazemRedes

# --- Banco de dados MySQL ---
# Antes de rodar, crie o banco (ex: CREATE DATABASE tutorial_db;)
# e ajuste usuario/senha conforme o seu MySQL local.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/ArmazemRedes?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
#createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=developer
spring.datasource.password=${DB_PASSWORD}


spring.jpa.hibernate.ddl-auto=validate

# Dialeto especifico do MySQL, para o Hibernate gerar o SQL correto
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Mostra no console os comandos SQL que o Hibernate executa (otimo para aprender)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Garante que o data.sql (dados de exemplo) rode SOMENTE depois que o Hibernate
# ja tiver criado as tabelas (senao o INSERT falharia por tabela nao existir)
# spring.jpa.defer-datasource-initialization=true

# Porta padrao da aplicacao
server.port=8080